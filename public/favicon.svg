<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- soft ground shadow under the pin -->
  <ellipse cx="16" cy="25.5" rx="6" ry="1.6" fill="#0b1a52" opacity="0.28"/>

  <!-- pin body -->
  <path
    d="M16 5.5c-4.14 0-7.5 3.3-7.5 7.36 0 5.52 6.2 11.4 7.03 12.17.27.25.67.25.94 0 .83-.77 7.03-6.65 7.03-12.17 0-4.07-3.36-7.36-7.5-7.36Z"
    fill="url(#pin)"
  />
  <!-- glossy highlight -->
  <path
    d="M9.7 11.2c.9-3.1 3.5-4.9 6.3-4.9 1 0 1.94.2 2.78.6-3.6.2-6.4 2.6-7.4 6-.2-.5-.5-1.1-1.68-1.7Z"
    fill="#ffffff"
    opacity="0.35"
  />

  <!-- inner disc -->
  <circle cx="16" cy="13" r="3.6" fill="url(#disc)"/>
  <circle cx="16" cy="13" r="3.6" fill="none" stroke="#0b1a52" stroke-opacity="0.12" stroke-width="0.5"/>
  <circle cx="14.7" cy="11.7" r="1.1" fill="#ffffff" opacity="0.55"/>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#5b4fe0"/>
    </linearGradient>
    <linearGradient id="pin" x1="8.5" y1="5.5" x2="23.5" y2="25.5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#dbe6ff"/>
      <stop offset="1" stop-color="#a9bdf5"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.35" cy="0.3" r="0.9">
      <stop stop-color="#8fa6ff"/>
      <stop offset="1" stop-color="#5b6fe0"/>
    </radialGradient>
  </defs>
</svg>
